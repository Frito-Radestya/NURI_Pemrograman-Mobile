      const stage = document.getElementById('slide-stage');
      const footer = document.getElementById('ob-footer');
      const skipBtn = document.getElementById('btn-skip');
      const nextBtn = document.getElementById('btn-next');

      if (currentSlide < 3) {
        const s = slides[currentSlide];
        footer.style.display = 'flex';
        skipBtn.style.visibility = 'visible';
        nextBtn.textContent = currentSlide === 2 ? 'Mulai Sekarang →' : 'Lanjut →';
        nextBtn.style.backgroundColor = currentSlide === 2 ? '#0B3210' : '#1F602E';

        document.querySelectorAll('.dot').forEach((d, idx) => {
          d.className = idx === currentSlide ? 'dot active' : 'dot';
        });

        stage.innerHTML = `
          <div class="illustration-box anim-pop">${s.svg}</div>
          <div class="text-box anim-up">

            <h1>${s.title}</h1>
            <p>${s.desc}</p>

        const isMother = selectedRole === 'mother';

          <div class="role-page anim-up">
            <span class="slide-badge">04 — Pilih Peran</span>
            <h1>Mulai Perjalanan Bersama NURI</h1>
            <p>Pilih peran untuk mendapatkan pengalaman aplikasi yang sesuai kebutuhanmu.</p>

            <div class="role-card ${isMother ? 'selected' : ''}" onclick="selectRole('mother')">
              <div class="role-title">Saya Ibu / Keluarga</div>
              <div class="role-desc">Pantau pertumbuhan anak berdasarkan standar WHO dan catat makanan harian.</div>
            </div>

            <div class="role-card ${!isMother ? 'selected' : ''}" onclick="selectRole('kader')">
              <div class="role-title">Saya Kader Posyandu</div>
              <div class="role-desc">Kelola penimbangan balita, skrining risiko stunting, dan data Posyandu.</div>
            </div>

            <button class="btn-primary" style="margin-top:20px;" onclick="goToSlide(0)">
              Lanjutkan ke Login / Daftar (${isMother ? 'Ibu / Keluarga' : 'Kader Posyandu'}) →
            </button>
          </div>
        `;
      }
    }

    function selectRole(role) {
      selectedRole = role;
      render();
    }

    function goToSlide(idx) {
      currentSlide = idx;
      render();
    }

    function nextSlide() {
      if (currentSlide < 3) {
        currentSlide++;
        render();
      }
    }

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
